name: ASU Seat Watch

# Runs in GitHub's cloud on a schedule — your laptop does NOT need to be on.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes (UTC). GitHub cron can lag a few min under load.
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Send a test WhatsApp message instead of checking seats"
        type: boolean
        default: false

# Auto-stop after Aug 30, 2026 handled inside the job (skips if past that date).

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop after end date
        id: window
        run: |
          END="2026-08-30"
          NOW=$(date -u +%Y-%m-%d)
          if [[ "$NOW" > "$END" ]]; then
            echo "Past $END — skipping. You can delete this workflow now."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install Playwright
        if: steps.window.outputs.skip == 'false'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check seats
        if: steps.window.outputs.skip == 'false'
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CLASS_NUMBER: "87932"
          TEST_MODE: ${{ github.event.inputs.test }}
        run: python check_seats.py
